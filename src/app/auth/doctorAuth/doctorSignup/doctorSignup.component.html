<div style="width: 100vw; min-height: 100vh; background: #0b0f19; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box; overflow-y: auto;">
  
  <div style="background: rgba(20, 21, 23, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; margin: auto;">
    
    <!-- Hospital Logo Header -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;">
      <span style="font-size: 30px; color: #ef4444;">✚</span>
      <h2 style="font-size: 22px; font-weight: 800; color: #ffffff; margin: 0; letter-spacing: 0.5px;">Apex Multispecialty Hospital</h2>
    </div>
    <p style="font-size: 13px; color: #00bfa5; font-weight: 700; margin-top: 0; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px;">👨‍⚕️ New Doctor Registration Portal</p>

    <!-- Doctor Signup Form -->
    <form (submit)="onDoctorSignup(signupForm)" #signupForm="ngForm" style="display: flex; flex-direction: column; gap: 14px;">
      
      <!-- Full Name -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase;">Doctor Name & Title</label>
        <input name="name" ngModel type="text" placeholder="Dr. Krupali Dholakiya" required style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
      </div>

      <!-- Email Field -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase;">Official Doctor Email</label>
        <input name="email" ngModel type="email" placeholder="krupali@apex.org" required email style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
      </div>

      <!-- Contact Phone & Doctor ID -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase;">Contact Number</label>
          <input name="contact" ngModel type="text" placeholder="+91 98250 12345" required style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box;">
        </div>

        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase;">Doctor Reg ID</label>
          <input name="docId" ngModel type="text" placeholder="DOC-CARD-101" required style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- Password Field -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase;">Security Password</label>
        <input name="password" ngModel type="password" placeholder="••••••••" required style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
      </div>

      <!-- Submit Button -->
      <button type="submit" style="background: linear-gradient(135deg, #00bfa5 0%, #00897b 100%); color: #ffffff; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 12px rgba(0, 191, 165, 0.3); transition: all 0.2s ease;">
        Register Doctor Profile ➔
      </button>

    </form>

    <!-- Footer Links -->
    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; color: #94a3b8;">
      Already registered? <a routerLink="/doctorLogin" style="color: #00bfa5; text-decoration: none; font-weight: 700;">Doctor Login Here</a>
    </div>

  </div>

</div>
