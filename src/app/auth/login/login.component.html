<div style="width: 100%; min-height: 100vh; background: #0b0f19; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box; overflow-y: auto;">
  
  <div style="background: rgba(20, 21, 23, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 36px 40px; max-width: 440px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; margin: auto;">
    
    <!-- Hospital Logo Header -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
      <span style="font-size: 28px; color: #ef4444;">✚</span>
      <h2 style="font-size: 22px; font-weight: 800; color: #ffffff; margin: 0; letter-spacing: 0.5px;">Apex Multispecialty Hospital</h2>
    </div>
    <p style="font-size: 13px; color: #00bfa5; font-weight: 700; margin-top: 0; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px;">MediCore Enterprise Portal Login</p>

    <!-- Login Form -->
    <form (submit)="onLogin(loginForm)" #loginForm="ngForm" style="display: flex; flex-direction: column; gap: 16px;">
      
      <!-- Role Selection -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 6px; text-transform: uppercase;">Select System Role</label>
        <select name="role" [(ngModel)]="selectedRole" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none; box-sizing: border-box;">
          <option value="Admin">System Administrator</option>
          <option value="Doctor">Doctor / Chief Medical Officer</option>
          <option value="Pharmacist">Head Pharmacist</option>
          <option value="Cashier">Hospital Cashier</option>
        </select>
      </div>

      <!-- Email Field -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 6px; text-transform: uppercase;">User Email Address</label>
        <input name="email" [(ngModel)]="enteredEmail" #emailInput="ngModel" type="email" placeholder="admin@apex.org" required email style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 12px 14px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
        <p *ngIf="!emailInput.valid && emailInput.touched" style="color: #ef4444; font-size: 12px; margin-top: 4px; margin-bottom: 0;">Please enter a valid email address</p>
      </div>

      <!-- Password Field -->
      <div style="text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-bottom: 6px; text-transform: uppercase;">Access Security Key / Password</label>
        <input name="password" [(ngModel)]="enteredPassword" #passwordInput="ngModel" type="password" placeholder="••••••••" required style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 12px 14px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
        <p *ngIf="!passwordInput.valid && passwordInput.touched" style="color: #ef4444; font-size: 12px; margin-top: 4px; margin-bottom: 0;">Please enter your security key</p>
      </div>

      <!-- Submit Button -->
      <button type="submit" style="background: linear-gradient(135deg, #00bfa5 0%, #00897b 100%); color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 12px rgba(0, 191, 165, 0.3); transition: all 0.2s ease;">
        Authorize & Login ➔
      </button>

    </form>

    <!-- Footer Links -->
    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; color: #94a3b8; display: flex; justify-content: center; gap: 16px;">
      <a routerLink="/signup" style="color: #00bfa5; text-decoration: none; font-weight: 700;">Create Account</a>
      <span>•</span>
      <a routerLink="/" style="color: #94a3b8; text-decoration: none;">Enterprise Dashboard</a>
    </div>

  </div>

</div>
