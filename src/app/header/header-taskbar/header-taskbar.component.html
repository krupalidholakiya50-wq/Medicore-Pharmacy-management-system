<div class="header-taskbar-wrapper">
  <div class="search-control">
    <input class="input" type="text" placeholder="Search" style="border-radius: 20px; border: none; background-color: #ffffff; color: #333333; padding-left: 36px; height: 38px; width: 100%; box-sizing: border-box;">
    <span class="search-icon">
      <i class="fa fa-search"></i>
    </span>
  </div>

  <div class="taskbar-buttons">
    <button class="button" routerLink="/doctorLogin" style="background-color: #ffffff; color: #333333; font-weight: 600; border-radius: 4px; border: none; height: 38px; padding: 0 16px;">
      Search
    </button>

    <button class="button" (click)="onLogout()" style="background-color: #00d1b2; color: #ffffff; font-weight: 700; border-radius: 4px; border: none; height: 38px; padding: 0 18px;">
      Log out
    </button>

    <button class="button" routerLink="/settings" style="background-color: #00d1b2; color: #ffffff; border-radius: 4px; border: none; width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; shrink-0;">

  </div>
</div>

<style>
  .header-taskbar-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;

  .search-icon {

    left: 12px;
    top: 10px;
    color: #888888;
  }

  .taskbar-buttons {
    display: flex;
    align-items: center;
    gap: 10px;

  @media (max-width: 1023px) {
