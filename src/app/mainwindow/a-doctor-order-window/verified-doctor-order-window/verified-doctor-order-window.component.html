

<div style="width: 100%; max-width: none; box-sizing: border-box; padding: 0;">
  <!-- Top Tab Bar -->
  <div class="tabs is-toggle is-fullwidth" style="margin-bottom: 20px; width: 100%;">
    <ul style="margin: 0; width: 100%; display: flex;">
      <li [class.is-active]="activeTab === 'New'" style="flex: 1;">
        <a routerLink="/doctororders" (click)="setActiveTab('New')"
           [style.background-color]="activeTab === 'New' ? '#3273dc' : '#ffffff'"
           [style.color]="activeTab === 'New' ? '#ffffff' : '#333333'"
           style="font-weight: 700; display: block; text-align: center; padding: 10px 16px; border-radius: 4px 0 0 4px; border: 1px solid #3273dc;">
          <span>New Oders</span>
        </a>
      </li>
      <li [class.is-active]="activeTab === 'Verified'" style="flex: 1;">
        <a routerLink="/doctororders/new" (click)="setActiveTab('Verified')"
           [style.background-color]="activeTab === 'Verified' ? '#3273dc' : '#ffffff'"
           [style.color]="activeTab === 'Verified' ? '#ffffff' : '#333333'"
           style="font-weight: 700; display: block; text-align: center; padding: 10px 16px; border-top: 1px solid #3273dc; border-bottom: 1px solid #3273dc; border-right: 1px solid #3273dc;">
          <span>Verified Oders</span>
        </a>
      </li>
      <li [class.is-active]="activeTab === 'PickedUp'" style="flex: 1;">
        <a routerLink="/doctororders/pickedUp" (click)="setActiveTab('PickedUp')"
           [style.background-color]="activeTab === 'PickedUp' ? '#3273dc' : '#ffffff'"
           [style.color]="activeTab === 'PickedUp' ? '#ffffff' : '#333333'"
           style="font-weight: 700; display: block; text-align: center; padding: 10px 16px; border-radius: 0 4px 4px 0; border: 1px solid #3273dc;">
          <span>Picked Up Oders</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Panel Canvas -->
  <div style="background-color: #e5e5e5; border-radius: 4px; padding: 20px; width: 100%; box-sizing: border-box;">
    <h2 style="font-size: 1.1rem; font-weight: 700; color: #222222; margin: 0 0 16px 0;">
      {{ activeTab === 'New' ? 'New Oders' : (activeTab === 'Verified' ? 'Verified Oders' : 'Picked Up Oders') }}
    </h2>
    <app-new-doctor-order-item *ngIf="activeTab === 'New'"></app-new-doctor-order-item>
    <app-verified-doctor-order-item *ngIf="activeTab === 'Verified'"></app-verified-doctor-order-item>
    <app-pickup-order-item *ngIf="activeTab === 'PickedUp'"></app-pickup-order-item>
  </div>
</div>
