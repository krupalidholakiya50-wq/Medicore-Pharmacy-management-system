<div style="background-color: #e6e6e6; border-radius: 6px; padding: 12px;">
  <div style="font-weight: 700; font-size: 1.1rem; color: #333333; margin-bottom: 12px;">
    Drug Quantity Chart
  </div>
  
  <div style="background-color: #16212e; border-radius: 4px; padding: 10px; overflow: hidden;">
    <div *ngIf="chartOptions">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [colors]="chartOptions.colors"
        [plotOptions]="chartOptions.plotOptions"
        [title]="chartOptions.title">
      </apx-chart>
    </div>
  </div>
</div>
